name: Deploy Order MFE

on:
  push:
    branches:
      - main
    paths:
      - "apps/order-mfe/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/deploy-order.yml"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  S3_BUCKET: react-mfe-order-prod-sha
  CLOUDFRONT_DISTRIBUTION_ID: E3LJKEHLBOSVLK

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Order MFE
        run: pnpm turbo build --filter=order-mfe...

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------
      # 7. Upload remoteEntry.js
      #
      # It is mutable and must be revalidated frequently.
      # --------------------------------------------------
      - name: Upload Order remote entry
        run: |
          aws s3 cp \
            apps/order-mfe/dist/remoteEntry.js \
            s3://${{ env.S3_BUCKET }}/remoteEntry.js \
            --cache-control "no-cache,no-store,must-revalidate"

      # --------------------------------------------------
      # 8. Upload index.html
      #
      # index.html must always resolve to the latest build.
      # --------------------------------------------------
      - name: Upload Order index
        run: |
          aws s3 cp \
            apps/order-mfe/dist/index.html \
            s3://${{ env.S3_BUCKET }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      # --------------------------------------------------
      # 9. Upload hashed static assets
      #
      # Hashed assets are immutable and can be cached for
      # a long period.
      #
      # IMPORTANT:
      # No --delete here. Old assets remain available for
      # users still running an older MFE version.
      # --------------------------------------------------
      - name: Upload Order assets
        run: |
          aws s3 sync apps/order-mfe/dist \
            s3://${{ env.S3_BUCKET }} \
            --exclude "remoteEntry.js" \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"

      # --------------------------------------------------
      # 10. Invalidate only mutable files
      # --------------------------------------------------
      - name: Invalidate Order CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html" "/remoteEntry.js"
