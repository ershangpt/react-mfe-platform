name: Deploy Shell

on:
  push:
    branches:
      - main
    paths:
      - "apps/shell/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/deploy-shell.yml"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  S3_BUCKET: react-mfe-shell-prod-sha
  CLOUDFRONT_DISTRIBUTION_ID: E2R1G5BO4J3EHD

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shell
        run: pnpm turbo build --filter=shell...

      - name: Debug GitHub OIDC
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Event: $GITHUB_EVENT_NAME"
          
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------
      # 8. Upload index.html
      #
      # index.html must always resolve to the latest build.
      # --------------------------------------------------
      - name: Upload Shell index
        run: |
          aws s3 cp \
            apps/shell/dist/index.html \
            s3://${{ env.S3_BUCKET }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      # --------------------------------------------------
      # 9. Upload hashed static assets
      #
      # Hashed assets are immutable and can be cached for
      # a long period.
      #
      # IMPORTANT:
      # No --delete here. Old assets remain available for
      # users still running an older MFE version.
      # --------------------------------------------------
      - name: Upload Shell assets
        run: |
          aws s3 sync apps/shell/dist \
            s3://${{ env.S3_BUCKET }} \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"

      # --------------------------------------------------
      # 10. Invalidate only mutable files
      # --------------------------------------------------
      - name: Invalidate Shell CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html"
